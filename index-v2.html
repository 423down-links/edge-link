var CH_ORDER = ['稳定版', 'Beta', 'Dev', 'Canary', 'Win7/2008R2', '企业版MSI'];
var CH_COLORS = { '稳定版': '#34d399', 'Beta': '#fbbf24', 'Dev': '#fb923c', 'Canary': '#fb7185', 'Win7/2008R2': '#94a3b8', '企业版MSI': '#c084fc' };
var activeCh = '全部';
var query = '';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtUTC4(isoStr) {
  var t = new Date(isoStr);
  if (isNaN(t.getTime())) return isoStr;
  var s = new Date(t.getTime() - 4 * 3600 * 1000).toISOString().slice(0, 19).replace('T', ' ');
  return s + ' (UTC-4)';
}

function shortSha(sha) {
  return sha.length > 30 ? sha.slice(0, 12) + '…' + sha.slice(-8) : sha;
}

function buildChips(items) {
  var box = document.getElementById('chips');
  var counts = {};
  items.forEach(function (i) { counts[i.channel] = (counts[i.channel] || 0) + 1; });
  var html = chipHtml('全部', '', items.length, activeCh === '全部');
  CH_ORDER.forEach(function (ch) {
    if (counts[ch]) html += chipHtml(ch, CH_COLORS[ch], counts[ch], activeCh === ch);
  });
  box.innerHTML = html;
}

function chipHtml(name, color, count, on) {
  return '<button class="chip' + (on ? ' on' : '') + '" data-ch="' + esc(name) + '"' +
    (color ? ' style="--c:' + color + '"' : '') + '>' +
    (color ? '<span class="dot"></span>' : '') + esc(name) + ' <span class="n">' + count + '</span></button>';
}

function renderData(data) {
  var items = (data && data.items) || [];
  buildChips(items);

  // 顶部时间取所有版本中最新的“官方发布时间”；无官方时间时回退 checked_at
  var published = items.map(function (i) { return i.published || ''; }).filter(Boolean).sort();
  var latest = published.length ? published[published.length - 1] : data.checked_at;
  var chans = {};
  items.forEach(function (i) { chans[i.channel] = 1; });
  document.getElementById('stats').innerHTML =
    '<span class="stat">最后检测更新时间 <b>' + esc(fmtUTC4(latest)) + '</b></span>' +
    '<span class="stat"><b>' + Object.keys(chans).length + '</b> 条通道</span>' +
    '<span class="stat"><b>' + items.length + '</b> 个安装包</span>';

  var body = document.getElementById('verBody');
  var q = query.trim().toLowerCase();
  var rows = '';
  var shown = 0;
  items.forEach(function (item) {
    if (activeCh !== '全部' && item.channel !== activeCh) return;
    if (q) {
      var hay = (item.version + ' ' + item.arch + ' ' + item.fileName + ' ' + item.channel).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }
    shown++;
    var sha = item.sha256 || '';
    var col = CH_COLORS[item.channel] || '#94a3b8';
    var shaCell = sha
      ? '<span class="sha" title="' + esc(sha) + '">' + esc(shortSha(sha)) + '</span>' +
        '<button class="copy" data-sha="' + esc(sha) + '">复制</button>'
      : '<span class="sha" style="color:#555">-</span>';
    rows +=
      '<tr>' +
      '<td data-label="通道"><span class="badge" style="--c:' + col + '"><i></i>' + esc(item.channel) + '</span></td>' +
      '<td data-label="架构" class="arch">' + esc(item.arch) + '</td>' +
      '<td data-label="版本号" class="ver">' + esc(item.version) + '</td>' +
      '<td data-label="大小" class="size">' + esc(item.size) + '</td>' +
      '<td data-label="文件名称" class="fname-cell"><span class="fname">' + esc(item.fileName) + '</span></td>' +
      '<td data-label="校验值 SHA256" class="sha-cell">' + shaCell + '</td>' +
      '<td data-label="下载"><a class="dl" href="' + esc(item.downloadURL) + '" target="_blank" rel="noopener">下载 ↓</a></td>' +
      '</tr>';
  });
  body.innerHTML = rows;
  document.getElementById('empty').hidden = shown > 0;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2000);
}

function fallbackCopy(text, btn) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  markCopied(btn);
  showToast('SHA256 已复制');
}

function markCopied(btn) {
  if (!btn) return;
  btn.classList.add('ok');
  var old = btn.textContent;
  btn.textContent = '已复制';
  setTimeout(function () { btn.classList.remove('ok'); btn.textContent = old; }, 1400);
}

function copyText(text, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      markCopied(btn);
      showToast('SHA256 已复制');
    }).catch(function () { fallbackCopy(text, btn); });
  } else {
    fallbackCopy(text, btn);
  }
}

document.getElementById('chips').addEventListener('click', function (e) {
  var c = e.target.closest('.chip');
  if (!c) return;
  activeCh = c.dataset.ch;
  document.querySelectorAll('#chips .chip').forEach(function (el) {
    el.classList.toggle('on', el.dataset.ch === activeCh);
  });
  renderData(EMBEDDED_DATA);
});

document.getElementById('search').addEventListener('input', function (e) {
  query = e.target.value;
  renderData(EMBEDDED_DATA);
});

document.getElementById('verBody').addEventListener('click', function (e) {
  var b = e.target.closest('.copy');
  if (b && b.dataset.sha) copyText(b.dataset.sha, b);
});

// 渲染嵌入数据（权威来源，每日自动更新）
renderData(EMBEDDED_DATA);
</script>
