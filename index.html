function copyText(id, btn) {
  var el = document.getElementById(id);
  if (!el || !el.dataset.sha) return;
  var text = el.dataset.sha;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      if (btn) { btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); }, 1500); }
      showToast('SHA256 已复制');
    }).catch(function() { fallbackCopy(text, btn); });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (btn) { btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); }, 1500); }
  showToast('SHA256 已复制');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// 稳定版官方发布时间（北京时间 UTC+8 固定偏移，带秒）
function fmtBeijing(isoStr) {
  var t = new Date(isoStr);
  if (isNaN(t.getTime())) return isoStr;
  var s = new Date(t.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 19).replace('T', ' ');
  return s + '（北京时间）';
}

function renderData(data) {
  var items = (data && data.items) || [];
  var body = document.getElementById('verBody');
  body.innerHTML = '';
  items.forEach(function(item) {
    var tr = document.createElement('tr');
    var shaId = 'sha-' + item.key;
    var shaVal = item.sha256 || '';
    var shaCell;
    if (shaVal) {
      shaCell = '<td class="sha-cell"><span class="sha" id="' + shaId + '" data-sha="' + shaVal + '">' + shaVal + '</span>' +
        '<button class="copy-btn" onclick="copyText(\'' + shaId + '\', this)">复制</button></td>';
    } else {
      shaCell = '<td class="sha-cell"><span class="sha" style="color:#555">-</span></td>';
    }
    tr.innerHTML =
      '<td><span class="ch-badge ' + chClass(item.channel) + '">' + item.channel + '</span></td>' +
      '<td class="arch">' + item.arch + '</td>' +
      '<td class="ver">' + item.version + '</td>' +
      '<td class="size">' + item.size + '</td>' +
      '<td class="fname-cell"><span class="fname">' + item.fileName + '</span></td>';
    tr.innerHTML += shaCell;
    tr.innerHTML += '<td><a class="dl-link" href="' + item.downloadURL + '" target="_blank" rel="noopener">下载 ↓</a></td>';
    body.appendChild(tr);
  });
  // 顶部时间只取「稳定版」（stable-*）里最新的官方发布时间，不是工作流运行时间；
  // 稳定版没拿到官方时间时才回退 checked_at（避免被 Canary/Beta 的日更带跑）
  var published = (data.items || []).filter(function (i) { return /^stable-/.test(i.key || ''); })
    .map(function (i) { return i.published || ''; })
    .filter(Boolean).sort();
  var latest = published.length ? published[published.length - 1] : data.checked_at;
  if (latest) {
    document.getElementById('versionInfo').textContent = '稳定版官方发布时间 ' + fmtBeijing(latest);
  }
}

// 渲染嵌入数据（权威来源，每日自动更新）
renderData(EMBEDDED_DATA);
</script>
