name: Update Edge Version

on:
  schedule:
    # 每小时检测官方 API；检测到更新自动 push + 部署，不再固定每天一次
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        if: github.event_name != 'push'
        run: python3 scripts/update_embedded.py

      - name: Commit and push if changed
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "423down"
          git config user.email "zd423@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无版本更新，跳过推送"
          else
            git commit -m "chore: update Edge version $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # 检测到更新（schedule/dispatch）或代码/数据变更（push）时都立即部署；直用 wrangler 避开组织对第三方 action 的限制
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1f5e2d11ee6dfb31343229a8e5c819b3
        run: npx --yes wrangler@3 pages deploy . --project-name edgelnk --branch main
