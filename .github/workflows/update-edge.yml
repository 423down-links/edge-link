name: Update Edge Version

on:
  schedule:
    # 目标北京时间每天凌晨 5:00（UTC 21:00）；GitHub Actions 调度普遍延迟约 15 分钟，故 cron 提前到 UTC 20:45
    - cron: '45 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python3 scripts/update_embedded.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "423down"
          git config user.email "zd423@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无版本更新，跳过推送"
          else
            git commit -m "chore: update Edge version $(date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 1f5e2d11ee6dfb31343229a8e5c819b3
          projectName: edgelnk
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
